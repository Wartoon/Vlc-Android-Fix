name: Autonomous VLC Fixes (Codex)
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Branch to inspect (auto alternates TV and Dual)
        type: choice
        required: true
        default: auto
        options: [auto, tv-v1, dual-db-restore]
permissions:
  contents: read
concurrency:
  group: autonomous-vlc-fixes
  cancel-in-progress: false

jobs:
  propose:
    name: AI examines code and prepares limited patch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      branch: ${{ steps.target.outputs.branch }}
      base_sha: ${{ steps.base.outputs.sha }}
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - name: Select branch
        id: target
        shell: bash
        env:
          REQUESTED: ${{ inputs.target }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          branch="$REQUESTED"
          if [[ "$EVENT_NAME" == schedule || "$branch" == auto || -z "$branch" ]]; then
            hour=$(date -u +%H)
            if (( 10#$hour % 4 == 0 )); then branch=dual-db-restore; else branch=tv-v1; fi
          fi
          case "$branch" in
            tv-v1|dual-db-restore) ;;
            *) echo "Unsupported target: $branch" >&2; exit 1 ;;
          esac
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Reviewing: $branch" >> "$GITHUB_STEP_SUMMARY"

      - name: Check AI API access
        id: key
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$API_KEY" ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Not active: create repository Actions secret OPENAI_API_KEY.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout VLC branch without write credentials
        if: steps.key.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Record base commit
        id: base
        if: steps.key.outputs.enabled == 'true'
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Investigate and fix one proven VLC bug
        if: steps.key.outputs.enabled == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          prompt: |
            Act as the autonomous maintainer for the checked-out VLC Android branch.
            Inspect actual source and call paths. Correct at most ONE demonstrable,
            low-risk bug. If no proven safe correction exists, leave Git clean.
            Do not make speculative changes, refactorings or cosmetic improvements.
            Branch: ${{ steps.target.outputs.branch }}.

            TV priorities: remote-control D-pad focus, returning from playback,
            directory focus restoration, grid/list, scrolling, resume and SMB.
            Dual priorities: small residual thumbnail/SMB/resume/scan/idle bugs.
            TV has no battery. No online artwork or metadata services.
            Only edit EXISTING .kt/.java files in these directories:
            TV: application/television/src/main/java/ or application/vlc-android/src/
            Dual: application/vlc-android/src/
            Never edit Kotlin outside these directories, manifests, signing,
            Gradle/buildsystem, repositories, CI, packages, Kodi or backup/restore.
            No new files, dependencies, permission changes, or thumbnail architecture.
            Keep current package IDs, app data and permanent signatures intact.
            Limit the patch to 4 files and 120 added/deleted lines total.
            The TV URI-prefix folder focus issue was already corrected in
            e7f136ae4cb2117186e505a4c7e67d2108ec738a; do not redo it.
            DO NOT git commit, push or call APIs. A separate trusted job publishes.
            Explain the exact bug, call path and why the fix is safe.

      - name: Validate changes and prepare patch
        id: patch
        if: steps.key.outputs.enabled == 'true'
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t files < <(git diff --name-only)
          if (( ${#files[@]} == 0 )); then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No safe correction identified.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if (( ${#files[@]} > 4 )); then echo 'Too many files' >&2; exit 1; fi
          for path in "${files[@]}"; do
            case "$TARGET:$path" in
              tv-v1:application/television/src/main/java/*.kt|\
              tv-v1:application/television/src/main/java/*.java|\
              tv-v1:application/vlc-android/src/*.kt|\
              tv-v1:application/vlc-android/src/*.java|\
              dual-db-restore:application/vlc-android/src/*.kt|\
              dual-db-restore:application/vlc-android/src/*.java) ;;
              *) echo "Rejected path: $path" >&2; exit 1 ;;
            esac
          done
          lines=$(git diff --numstat | awk '{if($1!~/^[0-9]+$/||$2!~/^[0-9]+$/)exit 5;sum+=$1+$2} END{print sum+0}')
          if (( lines > 120 )); then echo 'Patch is too large' >&2; exit 1; fi
          git diff --binary > "$RUNNER_TEMP/vlc-fix.patch"
          test -s "$RUNNER_TEMP/vlc-fix.patch"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "Proposed ${#files[@]} file(s); $lines changed lines" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload patch to isolated publisher
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vlc-autofix-patch
          path: ${{ runner.temp }}/vlc-fix.patch
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Independently validate, push, dispatch APK CI
    needs: propose
    if: needs.propose.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Clean checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.propose.outputs.branch }}
          fetch-depth: 1

      - name: Download generated patch
        uses: actions/download-artifact@v4
        with:
          name: vlc-autofix-patch
          path: ${{ runner.temp }}/vlc-fix

      - name: Check patch and publish commit
        id: commit
        shell: bash
        env:
          TARGET: ${{ needs.propose.outputs.branch }}
          BASE_SHA: ${{ needs.propose.outputs.base_sha }}
        run: |
          set -euo pipefail
          echo 'pushed=false' >> "$GITHUB_OUTPUT"
          if [[ "$(git rev-parse HEAD)" != "$BASE_SHA" ]]; then
            echo 'Branch advanced: stale patch skipped.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          patch="$RUNNER_TEMP/vlc-fix/vlc-fix.patch"
          test -s "$patch"
          git apply --check "$patch"
          git apply "$patch"
          git diff --check
          mapfile -t files < <(git diff --name-only)
          if (( ${#files[@]} == 0 || ${#files[@]} > 4 )); then
            echo 'Invalid number of changed files' >&2; exit 1
          fi
          for path in "${files[@]}"; do
            case "$TARGET:$path" in
              tv-v1:application/television/src/main/java/*.kt|\
              tv-v1:application/television/src/main/java/*.java|\
              tv-v1:application/vlc-android/src/*.kt|\
              tv-v1:application/vlc-android/src/*.java|\
              dual-db-restore:application/vlc-android/src/*.kt|\
              dual-db-restore:application/vlc-android/src/*.java) ;;
              *) echo "Rejected patch path: $path" >&2; exit 1 ;;
            esac
          done
          lines=$(git diff --numstat | awk '{if($1!~/^[0-9]+$/||$2!~/^[0-9]+$/)exit 5;sum+=$1+$2} END{print sum+0}')
          if (( lines > 120 )); then echo 'Patch exceeds size cap' >&2; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m "fix($TARGET): automated minimal VLC correction"
          git push origin "HEAD:refs/heads/$TARGET"
          echo 'pushed=true' >> "$GITHUB_OUTPUT"
          echo "Committed $(git rev-parse HEAD) on $TARGET" >> "$GITHUB_STEP_SUMMARY"

      # GITHUB_TOKEN commits do not trigger push workflows. Dispatch is explicit.
      - name: Dispatch existing signed APK build
        if: steps.commit.outputs.pushed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.propose.outputs.branch }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build-fixed-apk.yml/dispatches" \
            --field "ref=$TARGET"
          echo "APK build dispatched for $TARGET" >> "$GITHUB_STEP_SUMMARY"
