name: Build VLC Android Resume Fix

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;21.4.7075529"

      - name: Initialize VLC build dependencies
        shell: bash
        env:
          ANDROID_SDK: ${{ env.ANDROID_HOME }}
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/21.4.7075529
        run: |
          chmod +x buildsystem/compile.sh
          buildsystem/compile.sh --init -a arm64

      - name: Build installable debug APK
        shell: bash
        env:
          ANDROID_SDK: ${{ env.ANDROID_HOME }}
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/21.4.7075529
        run: |
          gradle :application:app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          find application/app/build/outputs/apk -type f -name '*.apk' -exec cp {} out/ \;
          test -n "$(find out -type f -name '*.apk' -print -quit)"
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vlc-android-3.7.2-beta2-resume-fix-debug
          path: out/*.apk
          if-no-files-found: error