name: Build VLC TV Fix V1

on:
  workflow_dispatch:
  push:
    branches: [ tv-v1 ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout VLC Android
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;21.4.7075529"

          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          android.ndkPath=$ANDROID_HOME/ndk/21.4.7075529
          android.ndkFullVersion=21.4.7075529
          EOF

      - name: Fetch exact VLC 3.x libvlcjni dependency
        shell: bash
        run: |
          git clone \
            --branch libvlcjni-3.x \
            --single-branch \
            https://code.videolan.org/videolan/libvlcjni.git \
            libvlcjni
          cd libvlcjni
          git checkout c0cc8ce6443dcb09be9b43c7b7a3ed01e33cb3ac
          git rev-parse HEAD
          test -d libvlc

      - name: Apply TV V1 changes
        shell: bash
        run: python3 buildsystem/apply-tv-v1.py

      - name: Verify TV V1 patch
        shell: bash
        run: |
          grep -q 'android:defaultValue="2"' application/vlc-android/res/xml/preferences.xml
          grep -q 'android:defaultValue="5000"' application/vlc-android/res/xml/preferences_adv.xml
          grep -q 'applicationIdSuffix ".tvfix"' application/app/build.gradle
          grep -q 'getInt(KEY_NETWORK_CACHING_VALUE, 5000)' application/resources/src/main/java/org/videolan/resources/VLCOptions.kt
          grep -q 'getBoolean(KEY_PREFER_SMBV1, false)' application/resources/src/main/java/org/videolan/resources/VLCOptions.kt
          grep -q 'encodedParent' application/television/src/main/java/org/videolan/television/ui/MediaItemDetailsFragment.kt
          grep -q 'Uri.parse(encodedParent)' application/television/src/main/java/org/videolan/television/ui/MediaItemDetailsFragment.kt

      - name: Build single TV APK
        shell: bash
        run: |
          gradle \
            :application:app:assembleTvFix \
            --stacktrace \
            --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          find application/app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -exec cp {} out/ \;
          test -f out/VLC-TV-Fix-all.apk
          echo "Generated APK:"
          ls -lh out/VLC-TV-Fix-all.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vlc-tv-3.7.2-beta2-v1
          path: out/VLC-TV-Fix-all.apk
          if-no-files-found: error
