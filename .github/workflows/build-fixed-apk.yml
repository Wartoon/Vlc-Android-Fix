name: Build VLC Android Resume Fix

on:
  workflow_dispatch:
  push:
    branches: [ dual-fix, dual-db-restore ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout VLC Android
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;21.4.7075529"
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          android.ndkPath=$ANDROID_HOME/ndk/21.4.7075529
          android.ndkFullVersion=21.4.7075529
          EOF

      - name: Fetch exact VLC 3.x libvlcjni dependency
        shell: bash
        run: |
          git clone --branch libvlcjni-3.x --single-branch https://code.videolan.org/videolan/libvlcjni.git libvlcjni
          cd libvlcjni
          git checkout c0cc8ce6443dcb09be9b43c7b7a3ed01e33cb3ac
          test "$(git rev-parse HEAD)" = "c0cc8ce6443dcb09be9b43c7b7a3ed01e33cb3ac"
          test -d libvlc

      - name: Harden database restore
        shell: bash
        run: |
          python3 buildsystem/harden-backup-restore.py
          python3 buildsystem/portable-dual-backup.py
          python3 buildsystem/remove-legacy-backup-ui.py

      - name: Verify dual backup contract and restore safety
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('application/vlc-android/src/org/videolan/vlc/gui/preferences/PreferencesAdvanced.kt').read_text()
          xml = Path('application/vlc-android/res/xml/preferences_adv.xml').read_text()
          required = [
              'replaceDirectoryContentsSafely(File(staging, "medialibrary/db"), mediaDbDir)',
              'replaceDirectoryContentsSafely(savedAppDb, appDbDir)',
              'replaceDirectoryContentsSafely(File(staging, "artwork/medialib"), it)',
              'replaceDirectoryContentsSafely(File(staging, "external/subtitles"), it)',
              'replaceDirectoryContentsSafely(File(staging, "keystore"), keyStoreDir)',
              '\"format\":2', '\"appFamily\":\"vlc-dual\"',
              '"org.videolan.vlc.internalstorage" -> "internal"',
              '"org.videolan.vlc.smb" -> "smb"',
              'val targetVariant = dualVariantForPackage(context.packageName)',
              'VLC Complete Backup - Internal Storage.zip',
              'VLC Complete Backup - SMB.zip',
              'Intent.ACTION_OPEN_DOCUMENT',
              'data.data?.let { showFullRestoreSelection(it) }',
              'private fun inspectFullBackup(src: Uri): BackupInspection',
              'val sourcePackage = validateDualManifest',
              'inspection.sourcePackage == requireContext().packageName',
              'private fun restoreFullBackup(\n        src: Uri,',
              'context.contentResolver.openInputStream(src)',
          ]
          for needle in required:
              if needle not in s: raise SystemExit(f'missing dual backup/restore guard: {needle}')
          forbidden = [
              '!manifestText.contains("\\\"package\\\":\\\"${context.packageName}\\\"")',
              '/VLC-Full-Backup.zip',
              'if (!it.deleteRecursively()) throw IOException("Cannot replace app database")',
              '"dump_media_db" ->', '"restore_media_db" ->', '"restore_app_db" ->', '"dump_app_db" ->',
              '"export_settings" ->', '"restore_settings" ->',
              'private fun restoreMediaDatabase()', 'private fun restoreAppDatabase()',
              'FILE_PICKER_RESULT_CODE) {',
          ]
          for needle in forbidden:
              if needle in s: raise SystemExit(f'forbidden legacy/destructive restore code remains: {needle}')
          for key in ('android:key="full_backup"', 'android:key="full_restore"'):
              if key not in xml: raise SystemExit(f'missing complete backup UI: {key}')
          for key in ('dump_media_db', 'restore_media_db', 'restore_app_db', 'dump_app_db', 'export_settings', 'restore_settings'):
              if f'android:key="{key}"' in xml: raise SystemExit(f'legacy backup UI remains: {key}')
          print('dual backup contract, transactional selective restore and legacy cleanup verified')
          PY

      - name: Verify build inputs
        shell: bash
        run: |
          test -d application/app
          test -d application/vlc-android
          test -d libvlcjni/libvlc
          test -f build.gradle
          test -f settings.gradle
          git diff --check
          echo "All required Gradle project directories exist."

      - name: Restore permanent signing keystore
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.VLC_DUAL_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.VLC_DUAL_STORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.VLC_DUAL_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE" && test -n "$SIGNING_PASSWORD" && test -n "$SIGNING_ALIAS"
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/signing/app.jks"
          keytool -list -keystore "$RUNNER_TEMP/signing/app.jks" -storepass "$SIGNING_PASSWORD" -alias "$SIGNING_ALIAS" >/dev/null
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing/app.jks" >> "$GITHUB_ENV"
          echo "SIGNING_ALIAS=$SIGNING_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Internal Storage and SMB APKs
        shell: bash
        run: |
          gradle -PkeyStoreFile="$SIGNING_KEYSTORE_PATH" -Pstorealias="$SIGNING_ALIAS" -Pstorepwd="$SIGNING_PASSWORD" :application:app:assembleInternalStorage :application:app:assembleSmb --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          find application/app/build/outputs/apk -type f -name '*.apk' -exec cp {} out/ \;
          test -f out/VLC-Internal-Storage-all.apk
          test -f out/VLC-SMB-all.apk
          sha256sum out/VLC-Internal-Storage-all.apk out/VLC-SMB-all.apk
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vlc-android-3.7.2-beta2-dual-resume-fix
          path: out/*.apk
          if-no-files-found: error
