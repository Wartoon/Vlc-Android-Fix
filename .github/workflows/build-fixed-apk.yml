name: Build VLC Android Resume Fix

on:
  workflow_dispatch:
  push:
    branches: [ dual-fix, dual-db-restore ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout VLC Android
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;21.4.7075529"

          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          android.ndkPath=$ANDROID_HOME/ndk/21.4.7075529
          android.ndkFullVersion=21.4.7075529
          EOF

      - name: Fetch exact VLC 3.x libvlcjni dependency
        shell: bash
        run: |
          git clone \
            --branch libvlcjni-3.x \
            --single-branch \
            https://code.videolan.org/videolan/libvlcjni.git \
            libvlcjni

          cd libvlcjni

          git checkout c0cc8ce6443dcb09be9b43c7b7a3ed01e33cb3ac

          echo "libvlcjni revision:"
          git rev-parse HEAD

          test -d libvlc

      - name: Verify build inputs
        shell: bash
        run: |
          test -d application/app
          test -d application/vlc-android
          test -d libvlcjni/libvlc
          test -f build.gradle
          test -f settings.gradle

          echo "All required Gradle project directories exist."

      - name: Build Internal Storage and SMB APKs
        shell: bash
        run: |
          gradle \
            :application:app:assembleInternalStorage \
            :application:app:assembleSmb \
            --stacktrace \
            --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out

          find application/app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -exec cp {} out/ \;

          test -f out/VLC-Internal-Storage-all.apk
          test -f out/VLC-SMB-all.apk

          echo "Generated APK files:"
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vlc-android-3.7.2-beta2-dual-resume-fix
          path: out/*.apk
          if-no-files-found: error