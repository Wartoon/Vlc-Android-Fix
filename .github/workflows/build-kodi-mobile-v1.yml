name: Build Kodi Mobile V1

on:
  push:
    branches: [kodi-mobile-v1]
    paths:
      - '.github/workflows/build-kodi-mobile-v1.yml'
      - 'kodi-mobile/**'
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      KODI_REF: e513e0ff4331fc25fd2454659a9dd3e6b7670146
      ANDROID_SDK_ROOT: /opt/android-sdk
      DEPENDS_PREFIX: /opt/kodi-depends
      TARBALLS: /opt/kodi-tarballs
    steps:
      - name: Checkout project controls
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf bison build-essential curl flex gawk git gperf \
            lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev unzip zip zlib1g-dev

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and exact NDK
        run: |
          sudo mkdir -p "$ANDROID_SDK_ROOT"
          sudo chown -R "$USER:$USER" "$ANDROID_SDK_ROOT"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/cmdline-tools.zip
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            platform-tools 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
          test -d "$ANDROID_SDK_ROOT/platforms/android-37.0"
          test -d "$ANDROID_SDK_ROOT/build-tools/37.0.0"
          test -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          grep -q 'Pkg.Revision = 28.2.13676358' "$ANDROID_SDK_ROOT/ndk/28.2.13676358/source.properties"
          java -version
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --list_installed

      - name: Create Kodi debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keypass android \
            -storepass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          test -s "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Clone and pin Kodi 22 Beta 2
        run: |
          git clone --filter=blob:none https://github.com/xbmc/xbmc.git kodi
          cd kodi
          git checkout --detach "$KODI_REF"
          test "$(git rev-parse HEAD)" = "$KODI_REF"
          echo "Pinned Kodi commit: $(git rev-parse HEAD)"

      - name: Apply and verify Kodi Mobile patch series
        run: |
          set -euo pipefail
          mapfile -t PATCHES < <(find "$GITHUB_WORKSPACE/kodi-mobile/patches" -maxdepth 1 -type f -name '*.patch' | sort)
          test "${#PATCHES[@]}" -gt 0
          for patch in "${PATCHES[@]}"; do
            echo "Checking $(basename "$patch")"
            git -C kodi apply --recount --check "$patch"
            git -C kodi apply --recount "$patch"
          done
          grep -Fq '<tap>OSD</tap>' kodi/system/keymaps/touchscreen.xml
          grep -Fq '<pan>PanGesture</pan>' kodi/system/keymaps/touchscreen.xml
          grep -Fq '<swipe direction="left"></swipe>' kodi/system/keymaps/touchscreen.xml
          grep -Fq '<swipe direction="right"></swipe>' kodi/system/keymaps/touchscreen.xml
          ! grep -Fq '<swipe direction="left">Seek(-10)</swipe>' kodi/system/keymaps/touchscreen.xml
          ! grep -Fq '<swipe direction="right">Seek(10)</swipe>' kodi/system/keymaps/touchscreen.xml
          grep -Fq 'const int64_t minTime = appPlayer->GetMinTime();' kodi/xbmc/video/windows/GUIWindowFullScreen.cpp
          grep -Fq 'const int64_t maxTime = appPlayer->GetMaxTime();' kodi/xbmc/video/windows/GUIWindowFullScreen.cpp
          grep -Fq 'm_pausedForScrub = true;' kodi/xbmc/video/windows/GUIWindowFullScreen.cpp
          grep -Fq 'const float delta = -0.5f * m_gestureOffsetY / height;' kodi/xbmc/video/windows/GUIWindowFullScreen.cpp
          ! grep -Fq 'PlayerGesture::Brightness' kodi/xbmc/video/windows/GUIWindowFullScreen.cpp
          git -C kodi diff --check
          git -C kodi diff --stat
          git -C kodi diff

      - name: Bootstrap and configure ARM64 depends
        run: |
          sudo mkdir -p "$DEPENDS_PREFIX" "$TARBALLS"
          sudo chown -R "$USER:$USER" "$DEPENDS_PREFIX" "$TARBALLS"
          cd kodi/tools/depends
          ./bootstrap
          ./configure \
            --with-tarballs="$TARBALLS" \
            --host=aarch64-linux-android \
            --with-sdk-path="$ANDROID_SDK_ROOT" \
            --prefix="$DEPENDS_PREFIX"

      - name: Build Kodi dependencies
        run: make -j"$(nproc)" -C kodi/tools/depends

      - name: Configure Kodi
        run: make -C kodi/tools/depends/target/cmakebuildsys BUILD_DIR="$GITHUB_WORKSPACE/kodi-build"

      - name: Build Kodi
        run: make -j"$(nproc)" -C kodi-build

      - name: Package APK
        env:
          KODI_ANDROID_KEY_ALIAS: androiddebugkey
          KODI_ANDROID_KEY_PASSWORD: android
          KODI_ANDROID_STORE_PASSWORD: android
          KODI_ANDROID_STORE_FILE: /home/runner/.android/debug.keystore
        run: |
          test -s "$KODI_ANDROID_STORE_FILE"
          make -C kodi-build apk

      - name: Verify and checksum APK
        run: |
          mapfile -t APKS < <(find kodi kodi-build -type f -name '*.apk' | sort -u)
          test "${#APKS[@]}" -gt 0
          printf 'APK: %s\n' "${APKS[@]}"
          sha256sum "${APKS[@]}" | tee kodi-mobile-sha256.txt
          mkdir -p kodi-mobile-artifact
          cp "${APKS[@]}" kodi-mobile-artifact/
          cp kodi-mobile-sha256.txt kodi-mobile-artifact/

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Kodi-Mobile-V1-player-gestures-arm64
          path: kodi-mobile-artifact/
          if-no-files-found: error
          retention-days: 14
